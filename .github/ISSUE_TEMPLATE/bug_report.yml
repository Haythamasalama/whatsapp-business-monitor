name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove access tokens, phone numbers and customer data from everything you paste here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can, reproduce it with `bun run demo`.
      placeholder: |
        1. Open a template
        2. Click «تعديل»
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or a commit hash"
  - type: input
    id: environment
    attributes:
      label: Node.js version and browser
      placeholder: Node 24.11, Chrome 142
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Drag images here. Please remove anything private.
