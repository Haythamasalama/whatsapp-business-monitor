name: whatsapp-business-monitor

# Written by install.sh; the settings it asks for live in .env next to this file.
services:
  app:
    image: ghcr.io/haythamasalama/whatsapp-business-monitor:${WHATSAPP_MANAGER_VERSION:-latest}
    container_name: whatsapp-business-monitor
    restart: unless-stopped
    # The owner of the data folder, so the database can be written; install.sh sets it.
    user: "${WHATSAPP_MANAGER_UID:-1000}:${WHATSAPP_MANAGER_GID:-1000}"
    ports:
      # 127.0.0.1 keeps it on this computer; install.sh --server sets 0.0.0.0 for other computers.
      - "${WHATSAPP_MANAGER_BIND:-127.0.0.1}:${WHATSAPP_MANAGER_PORT:-3210}:3210"
    environment:
      WHATSAPP_TEMPLATES_UPDATE_CHECK: ${WHATSAPP_TEMPLATES_UPDATE_CHECK:-true}
      # Tells the page that the updater below installs new versions on its own.
      WHATSAPP_TEMPLATES_AUTO_UPDATE: "true"
      # Lets the "Update now" button ask the updater below to install a new version right away.
      WHATSAPP_MANAGER_UPDATE_URL: http://updater:8080/v1/update
      WHATSAPP_MANAGER_UPDATE_TOKEN: ${WHATSAPP_MANAGER_UPDATE_TOKEN:-}
      # Lets the settings page show where the database is on this computer.
      WHATSAPP_MANAGER_DATA_SHOWN: ${WHATSAPP_MANAGER_DATA:-${HOME}/.config/whatsapp-templates}
      WHATSAPP_MANAGER_HOST_HOME: ${HOME}
      # Extra names the app answers to besides localhost and its saved address, comma separated.
      WHATSAPP_MANAGER_ALLOWED_HOSTS: ${WHATSAPP_MANAGER_ALLOWED_HOSTS:-}
      # true only behind a reverse proxy you run, so sign-in limits count the real visitor's address.
      WHATSAPP_MANAGER_TRUST_PROXY: ${WHATSAPP_MANAGER_TRUST_PROXY:-false}
    volumes:
      # The database: accounts, settings and users. Kept on this computer across updates.
      - ${WHATSAPP_MANAGER_DATA:-${HOME}/.config/whatsapp-templates}:/data/accounts
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Installs each new release by itself: every 6 hours it pulls the image and, when it changed,
  # restarts the app on it with the same settings and data. A pinned WHATSAPP_MANAGER_VERSION stays put.
  # The app's "Update now" button asks it to do the same at once, through its API on this compose network
  # only (no port is published), with the secret install.sh writes to .env.
  updater:
    image: nickfedor/watchtower:latest
    container_name: whatsapp-business-monitor-updater
    restart: unless-stopped
    environment:
      # Only containers with the label above are touched, never the rest of this computer's Docker.
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "21600"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      WATCHTOWER_HTTP_API_TOKEN: ${WHATSAPP_MANAGER_UPDATE_TOKEN:?run install.sh to create WHATSAPP_MANAGER_UPDATE_TOKEN}
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
